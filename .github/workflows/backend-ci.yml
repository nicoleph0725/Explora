name: Backend CI

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    # Since .env is gitignored, provide dummy environment variables
    # so database.py and sign_up.py don't crash when imported in CI.
    # conftest.py routes all actual test queries to in-memory SQLite.
    env:
      DATABASE_URL: sqlite:///dummy.db
      SECRET_KEY: ci-temporary-secret-key-for-testing
      ALGORITHM: HS256

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Tests
        working-directory: backend
        run: pytest -v
